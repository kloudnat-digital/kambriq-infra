name: Terraform Prod (infra only)

on:
  workflow_dispatch:

jobs:
  terraform-prod:
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION: eu-central-1
      TF_VERSION: 1.5.0
      WORKING_DIR: envs/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ secrets.AWS_REGION_PROD }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -input=false -out=terraform.tfplan

      - name: Upload Terraform plan (prod)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-prod
          path: ${{ env.WORKING_DIR }}/terraform.tfplan
          retention-days: 30

      - name: Terraform Apply
        if: success()
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -input=false -auto-approve terraform.tfplan
