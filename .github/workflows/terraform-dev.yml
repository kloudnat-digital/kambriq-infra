name: Terraform Dev (infra only)

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'envs/dev/**'
      - 'modules/**'
      - '.github/workflows/terraform-dev.yml'
  push:
    branches:
      - develop
    paths:
      - 'envs/dev/**'
      - 'modules/**'
      - '.github/workflows/terraform-dev.yml'
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Run plan only (no apply)'
        type: boolean
        default: true

jobs:
  terraform-dev:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-central-1
      TF_VERSION: 1.5.0
      WORKING_DIR: envs/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ secrets.AWS_REGION_DEV }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name != 'push'
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -input=false

      - name: Terraform Plan (push develop)
        if: github.event_name == 'push'
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -input=false -out=terraform.tfplan

      - name: Upload Terraform plan (dev)
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-dev
          path: ${{ env.WORKING_DIR }}/terraform.tfplan
          retention-days: 7

      - name: Terraform Apply (push develop)
        if: github.event_name == 'push' && success()
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -input=false -auto-approve terraform.tfplan
