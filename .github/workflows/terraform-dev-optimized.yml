name: Terraform Dev (Optimized)

on:
  pull_request:
    branches: [ develop ]
    paths:
      - "envs/dev/**"
      - "modules/**"
      - ".github/workflows/terraform-dev*.yml"
  push:
    branches: [ develop ]
    paths:
      - "envs/dev/**"
      - "modules/**"
      - ".github/workflows/terraform-dev*.yml"
  workflow_dispatch:
    inputs:
      skip_apply:
        description: 'Skip apply (plan only)'
        type: boolean
        default: false

jobs:
  terraform-dev:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1
      TF_VERSION: 1.5.0
      WORKING_DIR: envs/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ secrets.AWS_REGION_DEV }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan -no-color -input=false -out=terraform.tfplan
        continue-on-error: true

      - name: Save Plan Output
        if: always() && steps.plan.outcome != 'skipped'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform show -no-color terraform.tfplan > plan.txt 2>/dev/null || echo "No plan available" > plan.txt
          echo "## Terraform Plan Output (DEV)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -n 500 plan.txt >> $GITHUB_STEP_SUMMARY || echo "Plan output not available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request' && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = 'Plan output not available';
            try {
              planOutput = fs.readFileSync('envs/dev/plan.txt', 'utf8');
            } catch (error) {
              planOutput = 'Error reading plan output';
            }

            const output = `#### Terraform Plan Results - DEV Infrastructure 📖
            
            **Format Check**: \`${{ steps.fmt.outcome }}\`
            **Initialization**: \`${{ steps.init.outcome }}\`
            **Validation**: \`${{ steps.validate.outcome }}\`
            **Plan**: \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`
            ${planOutput.substring(0, 5000)}
            \`\`\`

            </details>

            *Workflow: \`${{ github.workflow }}\`, Actor: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Upload Terraform plan
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-dev
          path: ${{ env.WORKING_DIR }}/terraform.tfplan
          retention-days: 7
          if-no-files-found: ignore

      - name: Terraform Apply
        if: |
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.skip_apply)) &&
          steps.plan.outcome == 'success'
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -input=false -auto-approve terraform.tfplan

      - name: Output Terraform State
        if: always() && steps.apply.conclusion == 'success'
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform output -json > terraform-outputs.json 2>/dev/null || true
          echo "## Terraform Outputs (DEV)" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat terraform-outputs.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No outputs available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
