name: Terraform Validate - V2

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "modules/**"
      - "envs/dev-v2/**"
      - "envs/prod-v2/**"
      - ".github/workflows/terraform-validate-v2.yml"
  pull_request:
    paths:
      - "modules/**"
      - "envs/dev-v2/**"
      - "envs/prod-v2/**"
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1

jobs:
  validate-dev-v2:
    name: Validate DEV V2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check
        working-directory: envs/dev-v2
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: envs/dev-v2
        run: |
          terraform init \
            -backend-config="bucket=kloudnat-infra-shared-store" \
            -backend-config="key=kambriq/dev-v2/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate
        working-directory: envs/dev-v2
        run: terraform validate

      - name: Terraform Plan
        working-directory: envs/dev-v2
        run: terraform plan -out=tfplan
        continue-on-error: true

