# ============================================================================
# Terraform Workflow - Shared Infrastructure
# ============================================================================
# Manages shared infrastructure (VPC, Route53, SES, ACM) used by all environments.
# This workflow manages the shared infrastructure stack (VPC, Route53, SES, ACM).
#
# Triggers:
# - Pull Request: Runs terraform plan only
# - Push to main: Runs terraform plan + apply
#
# AWS Credentials Configuration:
# Currently configured for Option 2: Static AWS Credentials
#   - Set GitHub Secrets:
#     - AWS_ACCESS_KEY_ID: your-access-key
#     - AWS_SECRET_ACCESS_KEY: your-secret-key
#     - AWS_REGION: eu-central-1 (or use default in env)
#
# Alternative: Option 1 - OIDC with IAM Role (see comments in workflow)
#   - Set GitHub Secrets:
#     - AWS_ROLE_ARN: arn:aws:iam::ACCOUNT_ID:role/github-actions-role
#     - AWS_REGION: eu-central-1
#   - Configure OIDC provider in AWS IAM (see AWS docs)
#
# ============================================================================

name: Terraform - Shared Infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - 'envs/shared/**'
      - 'modules/shared/**'
      - 'modules/**'
      - '.github/workflows/terraform-shared.yml'

  push:
    branches:
      - main
    paths:
      - 'envs/shared/**'
      - 'modules/shared/**'
      - 'modules/**'
      - '.github/workflows/terraform-shared.yml'

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.5.0
  WORKING_DIR: envs/shared

jobs:
  terraform:
    name: Terraform Shared
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for OIDC
      contents: read
      pull-requests: write # Required to comment on PRs

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        # Using static credentials (Option 2)
        # Required GitHub Secrets:
        #   - AWS_ACCESS_KEY_ID
        #   - AWS_SECRET_ACCESS_KEY
        #   - AWS_REGION (or use env.AWS_REGION default)
        #
        # Alternative: To use OIDC (Option 1), comment out the section below
        # and uncomment the OIDC section above, then configure AWS_ROLE_ARN secret.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true

      - name: Save Plan Output
        if: github.event_name == 'pull_request'
        run: |
          terraform show -no-color tfplan > plan.txt || echo "No plan available" > plan.txt
          echo "## Terraform Plan Output (Shared)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat plan.txt >> $GITHUB_STEP_SUMMARY || echo "Plan output not available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = 'Plan output not available';
            try {
              planOutput = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');
            } catch (error) {
              planOutput = 'Error reading plan output';
            }

            const output = `#### Terraform Plan Results - Shared Infrastructure 📖
            
            **Format Check**: \`${{ steps.fmt.outcome }}\`
            **Initialization**: \`${{ steps.init.outcome }}\`
            **Validation**: \`${{ steps.validate.outcome }}\`
            **Plan**: \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`
            ${planOutput}
            \`\`\`

            </details>

            *Workflow: \`${{ github.workflow }}\`, Actor: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Upload Plan Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-shared
          path: ${{ env.WORKING_DIR }}/plan.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: Terraform Apply
        id: apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -f tfplan ]; then
            terraform apply -auto-approve -input=false tfplan
          else
            terraform apply -auto-approve -input=false
          fi

      - name: Output Terraform State
        if: always() && (steps.apply.conclusion == 'success' || steps.plan.conclusion == 'success')
        run: |
          terraform output -json > terraform-outputs.json || true
          echo "## Terraform Outputs (Shared)" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat terraform-outputs.json >> $GITHUB_STEP_SUMMARY || echo "No outputs available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Display Key Outputs
        if: always() && (steps.apply.conclusion == 'success' || steps.plan.conclusion == 'success')
        run: |
          echo "### Key Infrastructure Outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          terraform output -raw vpc_id >> /dev/null 2>&1 && echo "- **VPC ID**: \`$(terraform output -raw vpc_id)\`" >> $GITHUB_STEP_SUMMARY || true
          terraform output -raw route53_zone_id >> /dev/null 2>&1 && echo "- **Route53 Zone ID**: \`$(terraform output -raw route53_zone_id)\`" >> $GITHUB_STEP_SUMMARY || true
          terraform output -raw api_certificate_arn >> /dev/null 2>&1 && echo "- **API Certificate ARN**: \`$(terraform output -raw api_certificate_arn)\`" >> $GITHUB_STEP_SUMMARY || true

      - name: Upload Terraform outputs
        if: always() && steps.apply.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-shared
          path: ${{ env.WORKING_DIR }}/terraform-outputs.json
          retention-days: 30
          if-no-files-found: ignore

