name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to apply"
        type: choice
        options:
          - shared
          - dev
        required: true

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.12.0"

concurrency:
  group: terraform-apply-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply (${{ inputs.env }})
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve environment
        id: env
        run: |
          set -euo pipefail
          ENV_NAME="${{ inputs.env }}"
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          AWS_REGION="$(awk -F'=' '/^aws_region/ { gsub(/["[:space:]]/, "", $2); print $2 }' "envs/${ENV_NAME}/terraform.tfvars")"
          echo "AWS_REGION=${AWS_REGION}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir="envs/${{ steps.env.outputs.env_name }}" init -reconfigure

      - name: Terraform format check
        run: terraform -chdir="envs/${{ steps.env.outputs.env_name }}" fmt -check -recursive -diff

      - name: Terraform validate
        run: terraform -chdir="envs/${{ steps.env.outputs.env_name }}" validate

      - name: Terraform plan
        id: plan
        run: |
          set -euo pipefail
          terraform -chdir="envs/${{ steps.env.outputs.env_name }}" plan -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Plan summary (pre-apply)
        run: |
          {
            echo "## Terraform plan — ${{ steps.env.outputs.env_name }} (pre-apply)"
            echo
            echo '```terraform'
            cat plan.txt 2>/dev/null || echo "(plan step did not produce output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        id: apply
        run: |
          set -euo pipefail
          terraform -chdir="envs/${{ steps.env.outputs.env_name }}" apply -no-color -auto-approve tfplan 2>&1 | tee apply.txt

      - name: Apply summary
        if: always()
        run: |
          {
            echo "## Terraform apply — ${{ steps.env.outputs.env_name }}"
            echo
            echo '```terraform'
            cat apply.txt 2>/dev/null || echo "(apply step did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload apply output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-${{ steps.env.outputs.env_name }}-${{ github.run_id }}
          path: |
            plan.txt
            apply.txt
          if-no-files-found: ignore
          retention-days: 30
