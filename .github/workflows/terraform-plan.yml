name: Terraform Plan

on:
  # No `paths:` filter, deliberately, and it is not an oversight.
  #
  # A required status check that does not report leaves a pull request waiting
  # for a status that will never arrive - the merge is blocked forever, with no
  # failure to look at. A workflow filtered by path does exactly that on any
  # pull request touching only documentation.
  #
  # So the workflow always runs and the *work* is filtered instead: detect-envs
  # is a few seconds, and the plan jobs below do nothing when no environment
  # changed. The gate at the end always reports, and it is the only check that
  # needs to be required.
  pull_request:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to plan"
        type: choice
        options:
          - shared
          - dev
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.12.0"


# ------------------------------------------------------------------------------
# CONCURRENCY
#
# A plan is a read. Three pushes to a PR used to run three full plan matrices to
# completion and bill all three - and every job here bills a full minute for
# work measured in seconds, so a superseded run is pure waste.
#
# Safe to cancel BECAUSE it is terraform plan: it acquires no state lock it
# cannot lose and changes nothing. `terraform-apply.yml` is the opposite case
# and keeps `cancel-in-progress: false` - a cancelled apply can leave the state
# file locked and the real infrastructure half-changed, which is not a CI
# problem but an AWS one.
# ------------------------------------------------------------------------------
concurrency:
  group: tf-plan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-envs:
    name: Detect changed environments
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      envs: ${{ steps.detect.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed environments
        id: detect
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          ENVS=()
          for ENV in shared dev; do
            if echo "$CHANGED" | grep -qE "^envs/${ENV}/|^modules/"; then
              ENVS+=("\"${ENV}\"")
            fi
          done
          # Always include dev if only .github/workflows changed (smoke-plan)
          if echo "$CHANGED" | grep -q "^\.github/workflows/terraform-"; then
            if ! printf '%s\n' "${ENVS[@]:-}" | grep -q '"dev"'; then
              ENVS+=("\"dev\"")
            fi
          fi
          if [[ ${#ENVS[@]} -eq 0 ]]; then
            ENVS+=("\"dev\"")
          fi
          MATRIX="[$(IFS=,; echo "${ENVS[*]}")]"
          echo "envs=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Environments to plan: ${MATRIX}"

  plan:
    name: Plan (${{ matrix.env }})
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    needs: [detect-envs]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect-envs.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        env: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.env)) || fromJson(needs.detect-envs.outputs.envs) }}
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve environment
        id: env
        run: |
          set -euo pipefail
          ENV_NAME="${{ matrix.env }}"
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          AWS_REGION="$(awk -F'=' '/^aws_region/ { gsub(/["[:space:]]/, "", $2); print $2 }' "envs/${ENV_NAME}/terraform.tfvars")"
          echo "AWS_REGION=${AWS_REGION}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform -chdir="envs/${{ steps.env.outputs.env_name }}" init -reconfigure

      - name: Terraform format check
        run: terraform -chdir="envs/${{ steps.env.outputs.env_name }}" fmt -check -recursive -diff

      - name: Terraform validate
        run: terraform -chdir="envs/${{ steps.env.outputs.env_name }}" validate

      - name: Terraform plan
        id: plan
        run: |
          set -euo pipefail
          terraform -chdir="envs/${{ steps.env.outputs.env_name }}" plan -no-color -out=tfplan.bin 2>&1 | tee plan.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # D15. The Fargate tasks run in public subnets with public IPs, so this
      # security group is the only thing between them and the internet - the
      # private subnet that used to be the second layer is gone. Asserted on
      # every pull request, against the resolved plan rather than the source,
      # because a `dynamic "ingress"` block cannot be read by grepping.
      #
      # Deliberately NOT conditional on the plan's exit code: a run that fails
      # to plan should not also skip the security assertion silently.
      - name: Assert the task security group admits only the ALB
        if: steps.env.outputs.env_name == 'dev'
        run: |
          set -euo pipefail
          terraform -chdir="envs/${{ steps.env.outputs.env_name }}" show -json tfplan.bin > tfplan.json
          ./scripts/assert-task-sg-closed.sh tfplan.json

      # D15. A route whose target has been deleted is not removed by AWS - it is
      # kept and marked blackhole, and traffic matching it is dropped silently.
      # That is the specific failure removing the NAT gateway risks, so it is
      # checked against the LIVE route tables: a blackhole is a fact about what
      # AWS holds now, appears only after an apply, and no plan can show it.
      - name: Assert no route points at a deleted target
        if: steps.env.outputs.env_name == 'dev'
        run: |
          set -euo pipefail
          vpc="$(terraform -chdir="envs/${{ steps.env.outputs.env_name }}" show -json tfplan.bin \
            | jq -r '.prior_state.values.root_module.child_modules[]?.resources[]?
                     | select(.type=="aws_vpc") | .values.id' | head -1)"
          if [ -z "$vpc" ]; then
            vpc="$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=kambriq-vpc \
              --query 'Vpcs[0].VpcId' --output text)"
          fi
          ./scripts/assert-no-blackhole-routes.sh "$vpc"

      # The environment convention: every resource carries its environment in an
      # Environment tag, and - for resources born after 2026-09-13 - in its name.
      # Read from the account tagging API, not from the plan, because the tag a
      # resource actually carries is a fact about AWS, and a resource can be
      # tagged or lose its tag outside this state. Account-scoped, so it runs on
      # the dev job rather than once per changed env; the check judges every
      # kambriq resource in the account regardless of which env this job is for.
      #
      # Not conditional on the plan exit code, for the same reason as the asserts
      # above: a failed plan must not silently skip a convention-relevant check.
      - name: Assert every resource carries its environment
        if: steps.env.outputs.env_name == 'dev'
        run: |
          set -euo pipefail
          ./scripts/assert-environment-convention.sh

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync('plan.txt') ? fs.readFileSync('plan.txt', 'utf8') : '(plan step did not run — a prior step failed)';
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... [output truncated — see step summary for full plan]'
              : plan;
            const body = [
              `## Terraform Plan \`${{ matrix.env }}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              truncated,
              '```',
              '</details>',
              '',
              `_Triggered by @${{ github.actor }} on \`${{ github.head_ref }}\`_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith(`## Terraform Plan \`${{ matrix.env }}\``)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Plan summary
        if: always()
        run: |
          {
            echo "## Terraform plan (${{ steps.env.outputs.env_name }})"
            echo
            echo '```terraform'
            cat plan.txt 2>/dev/null || echo "(plan step did not run — a prior step failed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ steps.env.outputs.env_name }}
          path: plan.txt
          if-no-files-found: ignore
          retention-days: 7

  # ── Shell script checks ───────────────────────────────────────────────────────
  # scripts/** was outside every path filter in this repo, so a shell script could
  # reach develop with no automated check of any kind. That is how the smoke test
  # stayed broken from May to September: it was never syntax-checked, never
  # linted, and its only runtime signal was a red job that nobody could tell
  # apart from a genuinely unhealthy environment.
  shell-lint:
    name: Shell Lint
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (bash -n)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/*.sh)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No shell scripts under scripts/, nothing to check."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "bash -n ${f}"
            bash -n "${f}"
          done

      - name: shellcheck
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck is not available on this runner, skipping."
            exit 0
          fi
          shellcheck --version
          shopt -s nullglob
          files=(scripts/*.sh)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No shell scripts under scripts/, nothing to check."
            exit 0
          fi
          shellcheck "${files[@]}"

      - name: Shell lint summary
        if: always()
        run: echo "Shell lint completed"

  # ── Terraform module unit tests ───────────────────────────────────────────────
  module-tests:
    name: Module Tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Test ALB module
        run: |
          terraform -chdir=modules/alb init -backend=false
          terraform -chdir=modules/alb test

      - name: Test RDS module
        run: |
          terraform -chdir=modules/rds-postgres init -backend=false
          terraform -chdir=modules/rds-postgres test

      - name: Module test summary
        if: always()
        run: echo "Module tests completed"

  # ---------------------------------------------------------------------------
  # The one check that is required, and the only one that can safely be.
  #
  # It reports on every pull request, whatever the change touches, so it can
  # never leave a merge waiting on a status that will not come. It passes only
  # if every job it depends on either succeeded or was legitimately skipped, and
  # a skipped job is genuinely fine here: a documentation change has no
  # environment to plan.
  #
  # `cancelled` and `failure` are both refused. Treating a cancellation as a
  # pass would let a cancelled run merge, which is the same hole as not
  # requiring the check at all.
  # ---------------------------------------------------------------------------
  gate:
    name: CI Gate
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    needs: [detect-envs, plan, shell-lint, module-tests]
    if: always()
    steps:
      - name: Refuse unless every job passed or was skipped
        run: |
          set -euo pipefail
          failed=0
          check() {
            case "$2" in
              success|skipped) echo "  ok       $1: $2" ;;
              *)               echo "  REFUSED  $1: $2"; failed=1 ;;
            esac
          }
          check "Detect changed environments" "${{ needs.detect-envs.result }}"
          check "Plan"                        "${{ needs.plan.result }}"
          check "Shell Lint"                  "${{ needs.shell-lint.result }}"
          check "Module Tests"                "${{ needs.module-tests.result }}"
          if [ "$failed" -ne 0 ]; then
            echo "CI Gate refuses this pull request." >&2
            exit 1
          fi
          echo "CI Gate: every job passed or was skipped."
